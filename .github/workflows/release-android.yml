name: Release — Android

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for artifact naming (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0-test'

permissions:
  contents: write

jobs:
  build-android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Debug APK — signed with Android's auto-generated debug keystore.
      # No setup needed. Can be installed on any Android device with
      # "Install from unknown sources" enabled in Settings.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "agent-studio-${{ env.RELEASE_TAG }}-android.apk"

      # Upload as a standalone build artifact — downloadable directly from
      # the Actions run page without needing a GitHub release.
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: agent-studio-${{ env.RELEASE_TAG }}-android.apk
          retention-days: 30

      # Also attach to the GitHub release if one exists for this tag
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: agent-studio-${{ env.RELEASE_TAG }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
