name: Release — Android

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v0.1.0) — used for artifact naming'
        required: false
        default: 'v0.1.0-manual'

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # Build a debug APK (no keystore needed — suitable for testing)
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'

      # Build release AAB (unsigned — ready for signing + Play Store upload)
      - name: Build release AAB (unsigned)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'

      - name: Rename artifacts
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "agent-studio-${VERSION}-android-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "agent-studio-${VERSION}-android-release-unsigned.aab"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            agent-studio-${{ env.RELEASE_TAG }}-android-debug.apk
            agent-studio-${{ env.RELEASE_TAG }}-android-release-unsigned.aab
          body: ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
