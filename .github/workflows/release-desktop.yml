name: Release — Desktop (Windows + macOS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v0.1.0) — used for artifact naming'
        required: false
        default: 'v0.1.0-manual'

jobs:
  build-tauri:
    permissions:
      contents: write
    env:
      # Use manual input tag if triggered via workflow_dispatch, else use the pushed tag
      RELEASE_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            arch: x64
          # Windows ARM64 (cross-compiled on x64 runner)
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc'
            arch: arm64
          # macOS Universal (Intel + Apple Silicon fat binary)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            arch: universal

    runs-on: ${{ matrix.platform }}
    name: Desktop — ${{ matrix.platform }} ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both targets for universal binary
          # Windows ARM64 needs the aarch64 target added
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      # Use the official Tauri action to compile & bundle
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Agent Studio ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## Agent Studio MCP Engine ${{ env.RELEASE_TAG }}

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` / `.exe` (NSIS) |
            | Windows ARM64 | `.msi` / `.exe` (NSIS) |
            | macOS Universal | `.dmg` (Intel + Apple Silicon) |
            | Android | See Android release |
            | iOS | See iOS release |

            ### Installing
            - **Windows**: Run the `.msi` installer or `.exe` setup
            - **macOS**: Open the `.dmg` and drag to Applications

            > First launch on macOS: right-click → Open if Gatekeeper warns (unsigned build)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: '.'
          tauriScript: 'npx tauri'
