name: Release — Desktop (Windows .exe + macOS .dmg)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for artifact naming (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0-test'

# Workflow-level write permission required for release creation via workflow_dispatch
permissions:
  contents: write

jobs:
  build-tauri:
    env:
      RELEASE_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 → produces Agent Studio_0.1.0_x64-setup.exe
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            arch: x64
            artifact_name: windows-x64-exe
          # Windows ARM64 → produces Agent Studio_0.1.0_arm64-setup.exe
          - platform: windows-latest
            args: '--target aarch64-pc-windows-msvc --bundles nsis'
            arch: arm64
            artifact_name: windows-arm64-exe
          # macOS Universal → produces Agent Studio_0.1.0_universal.dmg
          # Pinned to macos-15 (macos-latest migrates to macOS 26 from June 2026)
          - platform: macos-15
            args: '--target universal-apple-darwin --bundles dmg'
            arch: universal
            artifact_name: macos-universal-dmg

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      # Tauri action compiles Rust, bundles the app, and uploads to the release.
      # Windows → NSIS installer (.exe)
      # macOS  → Disk image (.dmg)
      - name: Build and bundle app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Agent Studio ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## Agent Studio MCP Engine ${{ env.RELEASE_TAG }}

            | Platform | Download |
            |---|---|
            | Windows x64 | `Agent Studio_*_x64-setup.exe` |
            | Windows ARM64 | `Agent Studio_*_arm64-setup.exe` |
            | macOS Universal | `Agent Studio_*_universal.dmg` |
            | Android | `agent-studio-*-android.apk` |
            | iOS | `agent-studio-*-ios-unsigned.ipa` (install via Sideloadly) |

            ### Install
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open `.dmg`, drag to Applications
            - **Android**: Enable "Install unknown apps", open `.apk`
            - **iOS**: Use [Sideloadly](https://sideloadly.io) (free) with your Apple ID
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: '.'
          tauriScript: 'npx tauri'

      # Also save as a standalone Actions artifact so you can download
      # the .exe / .dmg directly from the workflow run page
      - name: Upload Windows .exe artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload macOS .dmg artifact
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
