name: Release — iOS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for artifact naming (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0-test'

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Unsigned IPA (real device)
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite web app
        run: npm run build

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      # Capacitor v8 uses Swift Package Manager — no CocoaPods needed.
      # Resolve SPM packages before building.
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ios/SourcePackages

      # Build for iphoneos (real device) with code signing disabled.
      # This produces an .app bundle that we'll manually package into an IPA.
      # The IPA can be installed on a device using Sideloadly or AltStore
      # (both re-sign with your Apple ID for free — no developer account needed).
      - name: Build iOS app (unsigned, real device)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ios/DerivedData \
            -clonedSourcePackagesDirPath ios/SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.agentstudio.mcpengine \
            build \
            | xcpretty || true

      # Package the .app into a standard IPA directory structure.
      # IPA = ZIP of a Payload/ folder containing the .app bundle.
      - name: Package .app into unsigned IPA
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          APP_PATH=$(find ios/DerivedData/Build/Products/Debug-iphoneos -name "App.app" -maxdepth 2 | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p ios/Payload
          cp -r "$APP_PATH" ios/Payload/App.app
          cd ios
          zip -r "../agent-studio-${VERSION}-ios-unsigned.ipa" Payload
          cd ..
          rm -rf ios/Payload

      # Upload as standalone Actions artifact — downloadable directly from
      # the Actions run page. No release or tag needed.
      - name: Upload IPA as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: agent-studio-${{ env.RELEASE_TAG }}-ios-unsigned.ipa
          retention-days: 30

      # Also attach to GitHub Release if triggered by a tag push
      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: agent-studio-${{ env.RELEASE_TAG }}-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO INSTALL THE UNSIGNED IPA ON YOUR IPHONE
# ─────────────────────────────────────────────────────────────────────────────
# Option A — Sideloadly (Windows or Mac):
#   1. Download Sideloadly from https://sideloadly.io
#   2. Connect your iPhone via USB
#   3. Drag the .ipa into Sideloadly, sign in with your Apple ID (free)
#   4. Hit Start — it signs and installs in ~30 seconds
#   5. Go to Settings > General > VPN & Device Management and trust your cert
#
# Option B — AltStore (Windows or Mac):
#   1. Install AltStore from https://altstore.io
#   2. Install AltStore on your iPhone via AltServer on your PC/Mac
#   3. Open AltStore on your iPhone > My Apps > + > pick the .ipa
#
# Note: Free Apple ID sideloading expires every 7 days and needs re-signing.
# ─────────────────────────────────────────────────────────────────────────────
